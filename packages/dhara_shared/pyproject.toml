[project]
name = "dhara-shared"
version = "0.1.0"
description = "DHARA platform shared domain models, water-balance engine, frame codec, and energy optimizer"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dhara_shared*"]
